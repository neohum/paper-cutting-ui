<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- PaperCut Multi-Tier Soft Umber 3D Shadows -->
    <filter id="pce-shadow-deep" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4A3828" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#4A3828" flood-opacity="0.12"/>
    </filter>
    <filter id="pce-shadow-mid" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4A3828" flood-opacity="0.14"/>
    </filter>
    <filter id="pce-shadow-lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#3A2518" flood-opacity="0.22"/>
    </filter>
    <filter id="pce-shadow-text" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4A3828" flood-opacity="0.16"/>
    </filter>

    <!-- Linear Gradients for Soft Paper Cardstock -->
    <linearGradient id="pce-grad-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF6ED"/>
    </linearGradient>
    <linearGradient id="pce-grad-mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B6E5D2"/>
      <stop offset="100%" stop-color="#8DCDB3"/>
    </linearGradient>
    <linearGradient id="pce-grad-peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAC8B0"/>
      <stop offset="100%" stop-color="#F2A584"/>
    </linearGradient>
    <linearGradient id="pce-grad-lavender" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2D8F5"/>
      <stop offset="100%" stop-color="#C5B4E4"/>
    </linearGradient>
    <linearGradient id="pce-grad-buttercup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#FCD56B"/>
    </linearGradient>
    <linearGradient id="pce-grad-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#ECE5D8"/>
    </linearGradient>
    <linearGradient id="pce-grad-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#483F37"/>
      <stop offset="100%" stop-color="#332B24"/>
    </linearGradient>

    <!-- Clip Path for Base Cardstock Rounded Squircle -->
    <clipPath id="pce-base-clip">
      <rect x="40" y="40" width="432" height="432" rx="108" />
    </clipPath>
  </defs>

  <!-- ============================================================== -->
  <!-- 1. BASE CARDSTOCK SQUIRCLE (512x512 Canvas)                     -->
  <!-- ============================================================== -->
  <rect x="40" y="40" width="432" height="432" rx="108" fill="url(#pce-grad-cream)" filter="url(#pce-shadow-deep)" />
  <rect x="40" y="40" width="432" height="432" rx="108" fill="none" stroke="#FAF1E3" stroke-width="3" />

  <!-- Nested Multi-Tier Pastel Paper Layers (Clipped) -->
  <g clip-path="url(#pce-base-clip)">
    <!-- Layer 1: Pastel Lavender Bottom Sheet -->
    <path d="M40 240 C120 200 240 250 340 200 C400 170 440 190 472 160 L472 472 L40 472 Z" 
          fill="url(#pce-grad-lavender)" opacity="0.9" />

    <!-- Layer 2: Pastel Mint Scallop Contour Sheet -->
    <path d="M40 310 C130 270 230 330 340 290 C400 260 440 290 472 260 L472 472 L40 472 Z" 
          fill="url(#pce-grad-mint)" filter="url(#pce-shadow-mid)" />

    <!-- Layer 3: Pastel Peach Arc Ribbon -->
    <path d="M40 380 C140 350 270 400 380 360 C430 340 455 360 472 340 L472 472 L40 472 Z" 
          fill="url(#pce-grad-peach)" filter="url(#pce-shadow-mid)" />

    <!-- Craft Grid Metric Guidelines -->
    <path d="M148 40 L148 472 M256 40 L256 472 M364 40 L364 472 M40 148 L472 148 M40 256 L472 256 M40 364 L472 364" 
          stroke="#EAE0D0" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.55" />
  </g>

  <!-- ============================================================== -->
  <!-- 2. ORIGAMI DOG-EAR CORNER FOLD (Top-Right)                     -->
  <!-- ============================================================== -->
  <g filter="url(#pce-shadow-mid)">
    <!-- Exposed Kraft Void -->
    <path d="M352 40 L472 40 L472 160 Z" fill="#E8D8C2" />
    <!-- Folded Flap in Buttercup Cardstock -->
    <path d="M352 40 L472 160 L352 160 Z" fill="url(#pce-grad-buttercup)" />
    <!-- Crease Highlights -->
    <line x1="352" y1="40" x2="352" y2="160" stroke="#F5C856" stroke-width="2.5" />
    <line x1="352" y1="160" x2="472" y2="160" stroke="#E5B540" stroke-width="2.5" />
  </g>

  <!-- ============================================================== -->
  <!-- 3. KIRIGAMI CUTTING TRAJECTORY ARC                             -->
  <!-- ============================================================== -->
  <path d="M400 160 C370 190 320 220 256 265" 
        fill="none" stroke="#7D7368" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" opacity="0.75" />

  <!-- ============================================================== -->
  <!-- 4. 3D KIRIGAMI CRAFT SCISSORS (Hero Motif)                     -->
  <!-- ============================================================== -->
  <g filter="url(#pce-shadow-lift)">
    <!-- Lower Blade (Back Layer) -->
    <path d="M250 270 L395 258 C406 257 412 265 409 274 L386 304 C382 310 374 312 367 308 L238 290 Z" 
          fill="url(#pce-grad-blade)" stroke="#D4C9B8" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Upper Handle Loop (Peach Pastel Cardstock) -->
    <path d="M245 255 L195 205 C165 178 124 190 106 220 C88 255 110 290 144 298 C166 302 190 290 206 272 L245 255 Z" 
          fill="url(#pce-grad-peach)" stroke="#E59A76" stroke-width="2.2" />
    <ellipse cx="145" cy="238" rx="27" ry="24" transform="rotate(-25 145 238)" 
             fill="#FFFDF9" stroke="#E59A76" stroke-width="1.8" />

    <!-- Upper Blade (Front Layer - Slicing Downwards) -->
    <path d="M245 255 L385 150 C396 142 408 152 403 162 L368 218 C364 225 356 228 348 228 L245 275 Z" 
          fill="url(#pce-grad-blade)" stroke="#D4C9B8" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Lower Handle Loop (Mint Pastel Cardstock) -->
    <path d="M238 282 L198 335 C178 360 136 368 106 342 C76 316 80 274 110 248 C131 231 161 235 182 252 L238 282 Z" 
          fill="url(#pce-grad-mint)" stroke="#74BA9E" stroke-width="2.2" />
    <ellipse cx="140" cy="310" rx="28" ry="24" transform="rotate(25 140 310)" 
             fill="#FFFDF9" stroke="#74BA9E" stroke-width="1.8" />

    <!-- Center Brass Rivet Fastener -->
    <circle cx="250" cy="268" r="18" fill="url(#pce-grad-buttercup)" stroke="#70530C" stroke-width="3" />
    <circle cx="250" cy="268" r="7.5" fill="#70530C" />
    <circle cx="245" cy="263" r="3.5" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- ============================================================== -->
  <!-- 5. FLOATING CONFETTI PIECES                                    -->
  <!-- ============================================================== -->
  <g filter="url(#pce-shadow-mid)">
    <polygon points="100,90 114,112 100,134 86,112" fill="url(#pce-grad-buttercup)" />
    <polygon points="410,350 435,366 398,382" fill="#A3D8C3" transform="rotate(20 415 365)" />
    <polygon points="420,205 432,217 420,229 408,217" fill="#F7BA9E" />
    <polygon points="300,85 310,95 300,105 290,95" fill="#D7CBEB" />
  </g>

  <!-- ============================================================== -->
  <!-- 6. BOTTOM BRAND LOCKUP: 'PaperCut UI'                          -->
  <!-- ============================================================== -->
  <g id="pce-brand-lockup" filter="url(#pce-shadow-text)">
    <!-- Pill Ribbon Backing -->
    <rect x="96" y="388" width="320" height="52" rx="26" fill="#FFFDF9" filter="url(#pce-shadow-mid)" />
    <rect x="96" y="388" width="320" height="52" rx="26" fill="none" stroke="#FAF1E3" stroke-width="1.5" />
    <rect x="100" y="392" width="312" height="44" rx="22" fill="none" stroke="#EFE5D5" stroke-width="1" stroke-dasharray="4 3" />

    <!-- Typography -->
    <text x="180" y="423" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Nanum Square Round', sans-serif" 
          font-size="28" font-weight="900" letter-spacing="-0.5" fill="url(#pce-grad-ink)">
      PaperCut
    </text>

    <!-- 'UI' Mini Mint Badge inside lockup -->
    <rect x="306" y="398" width="46" height="32" rx="10" fill="url(#pce-grad-mint)" filter="url(#pce-shadow-mid)" />
    <text x="329" y="422" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="18" font-weight="900" fill="#FFFFFF">
      UI
    </text>

    <!-- Tiny Scissors Icon / Palette Dots at left of ribbon -->
    <circle cx="132" cy="414" r="5" fill="#A3D8C3" />
    <circle cx="148" cy="414" r="5" fill="#F7BA9E" />
    <circle cx="164" cy="414" r="5" fill="#FFE082" />
  </g>
</svg>