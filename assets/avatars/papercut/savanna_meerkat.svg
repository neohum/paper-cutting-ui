<svg class="pc-layered-paper-avatar" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" data-avatar-id="savanna_meerkat" data-category="savanna">
  <defs>
    
    <filter id="ps-savanna_meerkat-base" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.11" dy="1.11" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="3.18" dy="3.18" stdDeviation="1.20" flood-color="#2E1E14" flood-opacity="0.38"/>
      <feDropShadow dx="-0.51" dy="-0.51" stdDeviation="0.32" flood-color="#FFFFFF" flood-opacity="0.85"/>
    </filter>
    <filter id="ps-savanna_meerkat-mid" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.89" dy="0.89" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.50"/>
      <feDropShadow dx="2.07" dy="2.07" stdDeviation="1.02" flood-color="#2E1E14" flood-opacity="0.32"/>
      <feDropShadow dx="-0.38" dy="-0.38" stdDeviation="0.25" flood-color="#FFFFFF" flood-opacity="0.90"/>
    </filter>
    <filter id="ps-savanna_meerkat-top" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.70" dy="0.70" stdDeviation="0.46" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="1.59" dy="1.59" stdDeviation="0.78" flood-color="#2E1E14" flood-opacity="0.28"/>
      <feDropShadow dx="-0.32" dy="-0.32" stdDeviation="0.22" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
  
    <linearGradient id="bg-grad-savanna_meerkat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F8F4EC"/>
    </linearGradient>
  </defs>

  <!-- Layer 0: Physical Paper Substrate & Perforated Rim -->
  <circle cx="50" cy="50" r="47" fill="url(#bg-grad-savanna_meerkat)" stroke="#E8E1D5" stroke-width="1.5" filter="url(#ps-savanna_meerkat-base)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#DCD3C5" stroke-width="0.75" stroke-dasharray="2,2"/>

  <!-- Layer 1: Category Themed Pastel Cardstock Plate -->
  <circle cx="50" cy="50" r="39" fill="#D97706" opacity="0.18" filter="url(#ps-savanna_meerkat-base)"/>
  
        <!-- Savanna Horizon & Acacia Cutouts -->
        <path d="M 18 76 L 82 76" stroke="#D97706" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <path d="M 24 76 L 24 60 Q 24 54 34 54 L 34 76" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
        <circle cx="74" cy="26" r="8" fill="#FEE396" opacity="0.7"/>
      

  <!-- Layer 2 & 3: Character Paper-Cut Silhouettes & Details -->
  
      <!-- Meerkat Slender Upright Head -->
      <ellipse cx="50" cy="50" rx="16" ry="18" fill="#D97706" filter="url(#ps-savanna_meerkat-mid)"/>
      <circle cx="36" cy="42" r="3.5" fill="#78350F"/>
      <circle cx="64" cy="42" r="3.5" fill="#78350F"/>
      <!-- Dark Eye Circles -->
      <ellipse cx="43" cy="47" rx="4.5" ry="3.5" fill="#451A03"/>
      <ellipse cx="57" cy="47" rx="4.5" ry="3.5" fill="#451A03"/>
      <circle cx="43" cy="47" r="1.8" fill="#FFFDF9"/>
      <circle cx="57" cy="47" r="1.8" fill="#FFFDF9"/>
      <polygon points="50,54 47,57 53,57" fill="#2E1E14"/>
    
</svg>