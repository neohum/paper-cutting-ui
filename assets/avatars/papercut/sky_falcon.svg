<svg class="pc-layered-paper-avatar" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" data-avatar-id="sky_falcon" data-category="sky">
  <defs>
    
    <filter id="ps-sky_falcon-base" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.11" dy="1.11" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="3.18" dy="3.18" stdDeviation="1.20" flood-color="#2E1E14" flood-opacity="0.38"/>
      <feDropShadow dx="-0.51" dy="-0.51" stdDeviation="0.32" flood-color="#FFFFFF" flood-opacity="0.85"/>
    </filter>
    <filter id="ps-sky_falcon-mid" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.89" dy="0.89" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.50"/>
      <feDropShadow dx="2.07" dy="2.07" stdDeviation="1.02" flood-color="#2E1E14" flood-opacity="0.32"/>
      <feDropShadow dx="-0.38" dy="-0.38" stdDeviation="0.25" flood-color="#FFFFFF" flood-opacity="0.90"/>
    </filter>
    <filter id="ps-sky_falcon-top" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.70" dy="0.70" stdDeviation="0.46" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="1.59" dy="1.59" stdDeviation="0.78" flood-color="#2E1E14" flood-opacity="0.28"/>
      <feDropShadow dx="-0.32" dy="-0.32" stdDeviation="0.22" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
  
    <linearGradient id="bg-grad-sky_falcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F8F4EC"/>
    </linearGradient>
  </defs>

  <!-- Layer 0: Physical Paper Substrate & Perforated Rim -->
  <circle cx="50" cy="50" r="47" fill="url(#bg-grad-sky_falcon)" stroke="#E8E1D5" stroke-width="1.5" filter="url(#ps-sky_falcon-base)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#DCD3C5" stroke-width="0.75" stroke-dasharray="2,2"/>

  <!-- Layer 1: Category Themed Pastel Cardstock Plate -->
  <circle cx="50" cy="50" r="39" fill="#475569" opacity="0.18" filter="url(#ps-sky_falcon-base)"/>
  
        <!-- Sky Cloud & Sun Ray Cutouts -->
        <path d="M 24 35 Q 32 26 42 34 Q 50 28 58 35 L 58 40 L 24 40 Z" fill="#FFFDF9" opacity="0.8"/>
        <circle cx="76" cy="24" r="7" fill="#FEE396" opacity="0.8"/>
      

  <!-- Layer 2 & 3: Character Paper-Cut Silhouettes & Details -->
  
      <!-- Sleek Falcon Head & Side Marks -->
      <ellipse cx="50" cy="48" rx="18" ry="17" fill="#334155" filter="url(#ps-sky_falcon-mid)"/>
      <polygon points="46,48 54,48 50,58" fill="#F59E0B" filter="url(#ps-sky_falcon-top)"/>
      <!-- Tear Stripe Markings -->
      <polygon points="40,50 38,62 43,54" fill="#0F172A"/>
      <polygon points="60,50 62,62 57,54" fill="#0F172A"/>
      
    <circle cx="41" cy="44" r="2.5" fill="#3D352E" filter="url(#ps-sky_falcon-top)"/>
    <circle cx="59" cy="44" r="2.5" fill="#3D352E" filter="url(#ps-sky_falcon-top)"/>
    <circle cx="40" cy="43" r="1" fill="#FFFDF9"/>
    <circle cx="58" cy="43" r="1" fill="#FFFDF9"/>
    <circle cx="36" cy="49" r="3" fill="#F7BA9E" opacity="0.7"/>
    <circle cx="64" cy="49" r="3" fill="#F7BA9E" opacity="0.7"/>
  
    
</svg>