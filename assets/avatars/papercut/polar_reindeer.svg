<svg class="pc-layered-paper-avatar" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" data-avatar-id="polar_reindeer" data-category="polar">
  <defs>
    
    <filter id="ps-polar_reindeer-base" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.11" dy="1.11" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="3.18" dy="3.18" stdDeviation="1.20" flood-color="#2E1E14" flood-opacity="0.38"/>
      <feDropShadow dx="-0.51" dy="-0.51" stdDeviation="0.32" flood-color="#FFFFFF" flood-opacity="0.85"/>
    </filter>
    <filter id="ps-polar_reindeer-mid" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.89" dy="0.89" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.50"/>
      <feDropShadow dx="2.07" dy="2.07" stdDeviation="1.02" flood-color="#2E1E14" flood-opacity="0.32"/>
      <feDropShadow dx="-0.38" dy="-0.38" stdDeviation="0.25" flood-color="#FFFFFF" flood-opacity="0.90"/>
    </filter>
    <filter id="ps-polar_reindeer-top" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.70" dy="0.70" stdDeviation="0.46" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="1.59" dy="1.59" stdDeviation="0.78" flood-color="#2E1E14" flood-opacity="0.28"/>
      <feDropShadow dx="-0.32" dy="-0.32" stdDeviation="0.22" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
  
    <linearGradient id="bg-grad-polar_reindeer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F8F4EC"/>
    </linearGradient>
  </defs>

  <!-- Layer 0: Physical Paper Substrate & Perforated Rim -->
  <circle cx="50" cy="50" r="47" fill="url(#bg-grad-polar_reindeer)" stroke="#E8E1D5" stroke-width="1.5" filter="url(#ps-polar_reindeer-base)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#DCD3C5" stroke-width="0.75" stroke-dasharray="2,2"/>

  <!-- Layer 1: Category Themed Pastel Cardstock Plate -->
  <circle cx="50" cy="50" r="39" fill="#B45309" opacity="0.18" filter="url(#ps-polar_reindeer-base)"/>
  
        <!-- Polar Iceberg & Aurora Cutouts -->
        <path d="M 18 78 L 36 50 L 52 78 Z" fill="#E0F2FE" opacity="0.7"/>
        <path d="M 50 78 L 68 56 L 84 78 Z" fill="#BDE0EA" opacity="0.5"/>
        <path d="M 20 28 Q 50 18 80 24" stroke="#67E8F9" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
      

  <!-- Layer 2 & 3: Character Paper-Cut Silhouettes & Details -->
  
      <!-- Reindeer Branching Antlers -->
      <path d="M 38 34 L 28 18 M 32 24 L 38 20 M 28 18 L 24 16" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 62 34 L 72 18 M 68 24 L 62 20 M 72 18 L 76 16" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="50" cy="52" rx="17" ry="17" fill="#B45309" filter="url(#ps-polar_reindeer-mid)"/>
      <!-- Glowing Red Nose -->
      <circle cx="50" cy="62" r="4.5" fill="#EF4444" filter="url(#ps-polar_reindeer-top)"/>
      <circle cx="48.5" cy="60.5" r="1.2" fill="#FFFDF9"/>
      
    <circle cx="43" cy="49" r="2.5" fill="#3D352E" filter="url(#ps-polar_reindeer-top)"/>
    <circle cx="57" cy="49" r="2.5" fill="#3D352E" filter="url(#ps-polar_reindeer-top)"/>
    <circle cx="42" cy="48" r="1" fill="#FFFDF9"/>
    <circle cx="56" cy="48" r="1" fill="#FFFDF9"/>
    <circle cx="38" cy="54" r="3" fill="#F7BA9E" opacity="0.7"/>
    <circle cx="62" cy="54" r="3" fill="#F7BA9E" opacity="0.7"/>
  
    
</svg>