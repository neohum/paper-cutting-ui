<svg class="pc-layered-paper-avatar" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" data-avatar-id="ocean_octopus" data-category="ocean">
  <defs>
    
    <filter id="ps-ocean_octopus-base" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.11" dy="1.11" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="3.18" dy="3.18" stdDeviation="1.20" flood-color="#2E1E14" flood-opacity="0.38"/>
      <feDropShadow dx="-0.51" dy="-0.51" stdDeviation="0.32" flood-color="#FFFFFF" flood-opacity="0.85"/>
    </filter>
    <filter id="ps-ocean_octopus-mid" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.89" dy="0.89" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.50"/>
      <feDropShadow dx="2.07" dy="2.07" stdDeviation="1.02" flood-color="#2E1E14" flood-opacity="0.32"/>
      <feDropShadow dx="-0.38" dy="-0.38" stdDeviation="0.25" flood-color="#FFFFFF" flood-opacity="0.90"/>
    </filter>
    <filter id="ps-ocean_octopus-top" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.70" dy="0.70" stdDeviation="0.46" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="1.59" dy="1.59" stdDeviation="0.78" flood-color="#2E1E14" flood-opacity="0.28"/>
      <feDropShadow dx="-0.32" dy="-0.32" stdDeviation="0.22" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
  
    <linearGradient id="bg-grad-ocean_octopus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F8F4EC"/>
    </linearGradient>
  </defs>

  <!-- Layer 0: Physical Paper Substrate & Perforated Rim -->
  <circle cx="50" cy="50" r="47" fill="url(#bg-grad-ocean_octopus)" stroke="#E8E1D5" stroke-width="1.5" filter="url(#ps-ocean_octopus-base)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#DCD3C5" stroke-width="0.75" stroke-dasharray="2,2"/>

  <!-- Layer 1: Category Themed Pastel Cardstock Plate -->
  <circle cx="50" cy="50" r="39" fill="#8B5CF6" opacity="0.18" filter="url(#ps-ocean_octopus-base)"/>
  
        <!-- Ocean Wave & Bubble Cutouts -->
        <path d="M 16 68 Q 30 60 44 68 T 72 68 T 88 68 L 88 88 L 16 88 Z" fill="#BDE0EA" opacity="0.65"/>
        <circle cx="26" cy="36" r="3.5" fill="#FFFDF9" opacity="0.7"/>
        <circle cx="76" cy="30" r="2.5" fill="#FFFDF9" opacity="0.6"/>
      

  <!-- Layer 2 & 3: Character Paper-Cut Silhouettes & Details -->
  
      <!-- Octopus Bulbous Head & Tentacles -->
      <ellipse cx="50" cy="44" rx="20" ry="18" fill="#8B5CF6" filter="url(#ps-ocean_octopus-mid)"/>
      <!-- Tentacles Cutout Rim -->
      <path d="M 32 58 Q 30 76 38 72 Q 44 76 50 70 Q 56 76 62 72 Q 70 76 68 58 Z" fill="#7C3AED" filter="url(#ps-ocean_octopus-mid)"/>
      
    <circle cx="42" cy="46" r="3" fill="#3D352E" filter="url(#ps-ocean_octopus-top)"/>
    <circle cx="58" cy="46" r="3" fill="#3D352E" filter="url(#ps-ocean_octopus-top)"/>
    <circle cx="41" cy="45" r="1.2000000000000002" fill="#FFFDF9"/>
    <circle cx="57" cy="45" r="1.2000000000000002" fill="#FFFDF9"/>
    <circle cx="37" cy="51" r="3" fill="#F7BA9E" opacity="0.7"/>
    <circle cx="63" cy="51" r="3" fill="#F7BA9E" opacity="0.7"/>
  
      <!-- Cheeks and Smile -->
      <circle cx="36" cy="52" r="3" fill="#F472B6" opacity="0.8"/>
      <circle cx="64" cy="52" r="3" fill="#F472B6" opacity="0.8"/>
      <circle cx="50" cy="54" r="2" fill="#FFFDF9"/>
    
</svg>