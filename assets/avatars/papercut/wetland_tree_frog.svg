<svg class="pc-layered-paper-avatar" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" data-avatar-id="wetland_tree_frog" data-category="wetland">
  <defs>
    
    <filter id="ps-wetland_tree_frog-base" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.11" dy="1.11" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="3.18" dy="3.18" stdDeviation="1.20" flood-color="#2E1E14" flood-opacity="0.38"/>
      <feDropShadow dx="-0.51" dy="-0.51" stdDeviation="0.32" flood-color="#FFFFFF" flood-opacity="0.85"/>
    </filter>
    <filter id="ps-wetland_tree_frog-mid" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.89" dy="0.89" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.50"/>
      <feDropShadow dx="2.07" dy="2.07" stdDeviation="1.02" flood-color="#2E1E14" flood-opacity="0.32"/>
      <feDropShadow dx="-0.38" dy="-0.38" stdDeviation="0.25" flood-color="#FFFFFF" flood-opacity="0.90"/>
    </filter>
    <filter id="ps-wetland_tree_frog-top" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.70" dy="0.70" stdDeviation="0.46" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="1.59" dy="1.59" stdDeviation="0.78" flood-color="#2E1E14" flood-opacity="0.28"/>
      <feDropShadow dx="-0.32" dy="-0.32" stdDeviation="0.22" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
  
    <linearGradient id="bg-grad-wetland_tree_frog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F8F4EC"/>
    </linearGradient>
  </defs>

  <!-- Layer 0: Physical Paper Substrate & Perforated Rim -->
  <circle cx="50" cy="50" r="47" fill="url(#bg-grad-wetland_tree_frog)" stroke="#E8E1D5" stroke-width="1.5" filter="url(#ps-wetland_tree_frog-base)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#DCD3C5" stroke-width="0.75" stroke-dasharray="2,2"/>

  <!-- Layer 1: Category Themed Pastel Cardstock Plate -->
  <circle cx="50" cy="50" r="39" fill="#16A34A" opacity="0.18" filter="url(#ps-wetland_tree_frog-base)"/>
  
        <!-- Wetland Reeds & Water Lilies -->
        <path d="M 22 80 Q 24 55 20 40 M 26 80 Q 28 50 32 38" stroke="#86EFAC" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
        <path d="M 74 80 Q 72 52 76 38 M 78 80 Q 82 56 80 44" stroke="#86EFAC" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
        <ellipse cx="50" cy="74" rx="14" ry="4" fill="#A3D8C3" opacity="0.5"/>
      

  <!-- Layer 2 & 3: Character Paper-Cut Silhouettes & Details -->
  
      <!-- Big Bulging Frog Eyes on Top -->
      <circle cx="36" cy="36" r="9" fill="#16A34A" filter="url(#ps-wetland_tree_frog-mid)"/>
      <circle cx="64" cy="36" r="9" fill="#16A34A" filter="url(#ps-wetland_tree_frog-mid)"/>
      <circle cx="36" cy="36" r="4.5" fill="#FEE396"/>
      <circle cx="64" cy="36" r="4.5" fill="#FEE396"/>
      <circle cx="36" cy="36" r="2.8" fill="#1F2937"/>
      <circle cx="64" cy="36" r="2.8" fill="#1F2937"/>
      <!-- Wide Smile Frog Face -->
      <ellipse cx="50" cy="54" rx="22" ry="16" fill="#22C55E" filter="url(#ps-wetland_tree_frog-mid)"/>
      <path d="M 38 56 Q 50 66 62 56" stroke="#14532D" stroke-width="2" stroke-linecap="round" fill="none"/>
      <circle cx="34" cy="54" r="3.5" fill="#F7BA9E" opacity="0.8"/>
      <circle cx="66" cy="54" r="3.5" fill="#F7BA9E" opacity="0.8"/>
    
</svg>