<svg class="pc-layered-paper-avatar" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" data-avatar-id="ocean_manta_ray" data-category="ocean">
  <defs>
    
    <filter id="ps-ocean_manta_ray-base" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.11" dy="1.11" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="3.18" dy="3.18" stdDeviation="1.20" flood-color="#2E1E14" flood-opacity="0.38"/>
      <feDropShadow dx="-0.51" dy="-0.51" stdDeviation="0.32" flood-color="#FFFFFF" flood-opacity="0.85"/>
    </filter>
    <filter id="ps-ocean_manta_ray-mid" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.89" dy="0.89" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.50"/>
      <feDropShadow dx="2.07" dy="2.07" stdDeviation="1.02" flood-color="#2E1E14" flood-opacity="0.32"/>
      <feDropShadow dx="-0.38" dy="-0.38" stdDeviation="0.25" flood-color="#FFFFFF" flood-opacity="0.90"/>
    </filter>
    <filter id="ps-ocean_manta_ray-top" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.70" dy="0.70" stdDeviation="0.46" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="1.59" dy="1.59" stdDeviation="0.78" flood-color="#2E1E14" flood-opacity="0.28"/>
      <feDropShadow dx="-0.32" dy="-0.32" stdDeviation="0.22" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
  
    <linearGradient id="bg-grad-ocean_manta_ray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F8F4EC"/>
    </linearGradient>
  </defs>

  <!-- Layer 0: Physical Paper Substrate & Perforated Rim -->
  <circle cx="50" cy="50" r="47" fill="url(#bg-grad-ocean_manta_ray)" stroke="#E8E1D5" stroke-width="1.5" filter="url(#ps-ocean_manta_ray-base)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#DCD3C5" stroke-width="0.75" stroke-dasharray="2,2"/>

  <!-- Layer 1: Category Themed Pastel Cardstock Plate -->
  <circle cx="50" cy="50" r="39" fill="#0284C7" opacity="0.18" filter="url(#ps-ocean_manta_ray-base)"/>
  
        <!-- Ocean Wave & Bubble Cutouts -->
        <path d="M 16 68 Q 30 60 44 68 T 72 68 T 88 68 L 88 88 L 16 88 Z" fill="#BDE0EA" opacity="0.65"/>
        <circle cx="26" cy="36" r="3.5" fill="#FFFDF9" opacity="0.7"/>
        <circle cx="76" cy="30" r="2.5" fill="#FFFDF9" opacity="0.6"/>
      

  <!-- Layer 2 & 3: Character Paper-Cut Silhouettes & Details -->
  
      <!-- Manta Ray Wide Wings -->
      <path d="M 50 28 L 84 52 L 50 74 L 16 52 Z" fill="#0284C7" filter="url(#ps-ocean_manta_ray-mid)"/>
      <!-- Tail & Horn Fins -->
      <line x1="50" y1="74" x2="50" y2="84" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="46,28 44,22 48,26" fill="#38BDF8"/>
      <polygon points="54,28 56,22 52,26" fill="#38BDF8"/>
      
    <circle cx="42" cy="42" r="2.5" fill="#3D352E" filter="url(#ps-ocean_manta_ray-top)"/>
    <circle cx="58" cy="42" r="2.5" fill="#3D352E" filter="url(#ps-ocean_manta_ray-top)"/>
    <circle cx="41" cy="41" r="1" fill="#FFFDF9"/>
    <circle cx="57" cy="41" r="1" fill="#FFFDF9"/>
    <circle cx="37" cy="47" r="3" fill="#F7BA9E" opacity="0.7"/>
    <circle cx="63" cy="47" r="3" fill="#F7BA9E" opacity="0.7"/>
  
    
</svg>