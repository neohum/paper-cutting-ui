    <linearGradient id="bg-grad-savanna_cheetah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F8F4EC"/>
    </linearGradient>
  </defs>

  <!-- Layer 0: Physical Paper Substrate & Perforated Rim -->
  <circle cx="50" cy="50" r="47" fill="url(#bg-grad-savanna_cheetah)" stroke="#E8E1D5" stroke-width="1.5" filter="url(#ps-savanna_cheetah-base)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#DCD3C5" stroke-width="0.75" stroke-dasharray="2,2"/>

  <!-- Layer 1: Category Themed Pastel Cardstock Plate -->
  <circle cx="50" cy="50" r="39" fill="#EA580C" opacity="0.18" filter="url(#ps-savanna_cheetah-base)"/>
  
        <!-- Savanna Horizon & Acacia Cutouts -->
        <path d="M 18 76 L 82 76" stroke="#D97706" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <path d="M 24 76 L 24 60 Q 24 54 34 54 L 34 76" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
        <circle cx="74" cy="26" r="8" fill="#FEE396" opacity="0.7"/>
      

  <!-- Layer 2 & 3: Character Paper-Cut Silhouettes & Details -->
  
      <!-- Cheetah Slender Head -->
      <ellipse cx="50" cy="50" rx="18" ry="16" fill="#F59E0B" filter="url(#ps-savanna_cheetah-mid)"/>
      <circle cx="34" cy="38" r="4" fill="#F59E0B"/>
      <circle cx="66" cy="38" r="4" fill="#F59E0B"/>
      <!-- Iconic Tear Tracks -->
