      <circle cx="62" cy="42" r="1.5" fill="#1F2937"/>
      <polygon points="50,54 47,57 53,57" fill="#1F2937"/>
      
    <circle cx="43" cy="46" r="2.5" fill="#3D352E" filter="url(#ps-savanna_cheetah-top)"/>
    <circle cx="57" cy="46" r="2.5" fill="#3D352E" filter="url(#ps-savanna_cheetah-top)"/>
