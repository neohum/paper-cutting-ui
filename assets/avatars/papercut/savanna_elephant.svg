<svg class="pc-layered-paper-avatar" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" data-avatar-id="savanna_elephant" data-category="savanna">
  <defs>
    
    <filter id="ps-savanna_elephant-base" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.11" dy="1.11" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="3.18" dy="3.18" stdDeviation="1.20" flood-color="#2E1E14" flood-opacity="0.38"/>
      <feDropShadow dx="-0.51" dy="-0.51" stdDeviation="0.32" flood-color="#FFFFFF" flood-opacity="0.85"/>
    </filter>
    <filter id="ps-savanna_elephant-mid" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.89" dy="0.89" stdDeviation="0.54" flood-color="#2E1E14" flood-opacity="0.50"/>
      <feDropShadow dx="2.07" dy="2.07" stdDeviation="1.02" flood-color="#2E1E14" flood-opacity="0.32"/>
      <feDropShadow dx="-0.38" dy="-0.38" stdDeviation="0.25" flood-color="#FFFFFF" flood-opacity="0.90"/>
    </filter>
    <filter id="ps-savanna_elephant-top" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.70" dy="0.70" stdDeviation="0.46" flood-color="#2E1E14" flood-opacity="0.55"/>
      <feDropShadow dx="1.59" dy="1.59" stdDeviation="0.78" flood-color="#2E1E14" flood-opacity="0.28"/>
      <feDropShadow dx="-0.32" dy="-0.32" stdDeviation="0.22" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
  
    <linearGradient id="bg-grad-savanna_elephant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F8F4EC"/>
    </linearGradient>
  </defs>

  <!-- Layer 0: Physical Paper Substrate & Perforated Rim -->
  <circle cx="50" cy="50" r="47" fill="url(#bg-grad-savanna_elephant)" stroke="#E8E1D5" stroke-width="1.5" filter="url(#ps-savanna_elephant-base)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#DCD3C5" stroke-width="0.75" stroke-dasharray="2,2"/>

  <!-- Layer 1: Category Themed Pastel Cardstock Plate -->
  <circle cx="50" cy="50" r="39" fill="#64748B" opacity="0.18" filter="url(#ps-savanna_elephant-base)"/>
  
        <!-- Savanna Horizon & Acacia Cutouts -->
        <path d="M 18 76 L 82 76" stroke="#D97706" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <path d="M 24 76 L 24 60 Q 24 54 34 54 L 34 76" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
        <circle cx="74" cy="26" r="8" fill="#FEE396" opacity="0.7"/>
      

  <!-- Layer 2 & 3: Character Paper-Cut Silhouettes & Details -->
  
      <!-- Large Round Ears -->
      <ellipse cx="30" cy="48" rx="12" ry="14" fill="#64748B" filter="url(#ps-savanna_elephant-base)"/>
      <ellipse cx="70" cy="48" rx="12" ry="14" fill="#64748B" filter="url(#ps-savanna_elephant-base)"/>
      <!-- Head & Curved Trunk -->
      <circle cx="50" cy="48" r="18" fill="#64748B" filter="url(#ps-savanna_elephant-mid)"/>
      <path d="M 47 54 L 47 68 Q 47 74 54 74 Q 57 74 57 70" stroke="#475569" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#ps-savanna_elephant-top)"/>
      <!-- Small Tusks -->
      <polygon points="44,60 38,66 43,65" fill="#FFFDF9"/>
      <polygon points="56,60 62,66 57,65" fill="#FFFDF9"/>
      
    <circle cx="42" cy="44" r="2.2" fill="#3D352E" filter="url(#ps-savanna_elephant-top)"/>
    <circle cx="58" cy="44" r="2.2" fill="#3D352E" filter="url(#ps-savanna_elephant-top)"/>
    <circle cx="41" cy="43" r="0.8800000000000001" fill="#FFFDF9"/>
    <circle cx="57" cy="43" r="0.8800000000000001" fill="#FFFDF9"/>
    <circle cx="37" cy="49" r="3" fill="#F7BA9E" opacity="0.7"/>
    <circle cx="63" cy="49" r="3" fill="#F7BA9E" opacity="0.7"/>
  
    
</svg>