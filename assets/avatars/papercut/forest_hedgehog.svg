    <circle cx="43" cy="52" r="2.5" fill="#3D352E" filter="url(#ps-forest_hedgehog-top)"/>
    <circle cx="57" cy="52" r="2.5" fill="#3D352E" filter="url(#ps-forest_hedgehog-top)"/>
