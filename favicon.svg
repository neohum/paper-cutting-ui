<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- PaperCut 3D Layer Shadows -->
    <filter id="pc-fav-shadow-base" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4A3828" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4A3828" flood-opacity="0.12"/>
    </filter>
    <filter id="pc-fav-shadow-mid" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4A3828" flood-opacity="0.16"/>
    </filter>
    <filter id="pc-fav-shadow-lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.5" dy="2" stdDeviation="1.5" flood-color="#3A2518" flood-opacity="0.22"/>
    </filter>

    <!-- Linear Gradients for Soft Paper Sheen -->
    <linearGradient id="pc-fav-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBF7EE"/>
    </linearGradient>
    <linearGradient id="pc-fav-mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B6E5D2"/>
      <stop offset="100%" stop-color="#93D0B8"/>
    </linearGradient>
    <linearGradient id="pc-fav-peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAC8B0"/>
      <stop offset="100%" stop-color="#F3AA8B"/>
    </linearGradient>
    <linearGradient id="pc-fav-lavender" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DFD4F2"/>
      <stop offset="100%" stop-color="#C5B4E4"/>
    </linearGradient>
    <linearGradient id="pc-fav-buttercup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE8A3"/>
      <stop offset="100%" stop-color="#FCD56B"/>
    </linearGradient>
    <linearGradient id="pc-fav-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#EDE6D8"/>
    </linearGradient>

    <!-- Clip Path for Base Cardstock Rounded Squircle -->
    <clipPath id="pc-fav-base-clip">
      <rect x="4" y="4" width="56" height="56" rx="16" />
    </clipPath>
  </defs>

  <!-- Layer 0: Base Cardstock with 3D Drop Shadow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#pc-fav-cream)" filter="url(#pc-fav-shadow-base)" />

  <!-- Layer 1: Nested Cut Paper Stack (Clipped inside squircle) -->
  <g clip-path="url(#pc-fav-base-clip)">
    <!-- Lavender Bottom Sheet -->
    <path d="M4 36 C16 32 32 38 46 30 C54 26 58 18 60 12 L60 60 L4 60 Z" fill="url(#pc-fav-lavender)" opacity="0.9" />
    
    <!-- Mint Middle Sheet with Kirigami Scallop/Wave -->
    <path d="M4 42 C14 38 26 44 40 38 C48 34 54 38 60 34 L60 60 L4 60 Z" fill="url(#pc-fav-mint)" filter="url(#pc-fav-shadow-mid)" />

    <!-- Peach Accent Strip -->
    <path d="M4 52 C18 48 34 54 48 48 C54 46 58 48 60 46 L60 60 L4 60 Z" fill="url(#pc-fav-peach)" />

    <!-- Subtle Cut Grid Texture Lines (Craft Cutting Mat feel) -->
    <path d="M20 4 L20 60 M36 4 L36 60 M4 20 L60 20 M4 36 L60 36 M4 52 L60 52" stroke="#EFE8DB" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6" />
  </g>

  <!-- Layer 2: Signature Origami Dog-Ear Corner Fold (Top-Right) -->
  <g filter="url(#pc-fav-shadow-mid)">
    <!-- Exposed Cut Void underneath -->
    <path d="M44 4 L60 4 L60 20 Z" fill="#EADBC6" />
    <!-- Folded Paper Triangle Flap -->
    <path d="M44 4 L60 20 L44 20 Z" fill="url(#pc-fav-buttercup)" />
    <!-- Crease Edge Highlight -->
    <line x1="44" y1="4" x2="44" y2="20" stroke="#FCD56B" stroke-width="0.75" />
    <line x1="44" y1="20" x2="60" y2="20" stroke="#EDC96C" stroke-width="0.75" />
  </g>

  <!-- Layer 3: Dashed Kirigami Cutting Trajectory -->
  <path d="M50 20 C46 23 38 27 30 33" fill="none" stroke="#7D7368" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2.5 2" opacity="0.75" />

  <!-- Layer 4: 3D Kirigami Craft Scissors (Hero Motif) -->
  <g filter="url(#pc-fav-shadow-lift)">
    <!-- Lower Blade (Back) -->
    <path d="M29 34 L49 32.5 C50.5 32.4 51.5 33.6 51 34.8 L48 39 C47.5 39.8 46.5 40 45.5 39.5 L27 37 Z" 
          fill="url(#pc-fav-blade)" stroke="#D8CEBD" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Upper Handle (Peach Pastel Loop) -->
    <path d="M28 32 L20 25 C16 21.5 10 23.5 8 28 C6 32.5 9 37.5 14 38.5 C17 39 20 37.5 22 35.5 L28 32 Z" 
          fill="url(#pc-fav-peach)" stroke="#E69D7B" stroke-width="0.6" />
    <!-- Upper Handle Hole -->
    <ellipse cx="14" cy="30" rx="3.8" ry="3.5" transform="rotate(-20 14 30)" fill="#FFFDF9" stroke="#E69D7B" stroke-width="0.5" />

    <!-- Upper Blade (Front - Cutting Down) -->
    <path d="M28 32 L47 17.5 C48.5 16.3 50.2 17.6 49.5 19.2 L44.5 27 C44 28 42.8 28.5 41.5 28.5 L28 35 Z" 
          fill="url(#pc-fav-blade)" stroke="#D8CEBD" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Lower Handle (Lavender/Mint Pastel Loop) -->
    <path d="M27 36 L21 43 C18 47 12 48.5 8 45 C4 41.5 4.5 35.5 9 32 C12 29.5 16 30 19 32 L27 36 Z" 
          fill="url(#pc-fav-mint)" stroke="#82C2A8" stroke-width="0.6" />
    <!-- Lower Handle Hole -->
    <ellipse cx="12" cy="40" rx="4" ry="3.5" transform="rotate(30 12 40)" fill="#FFFDF9" stroke="#82C2A8" stroke-width="0.5" />

    <!-- Center Pivot Rivet (Golden Brass Craft Fastener) -->
    <circle cx="28.5" cy="34" r="3" fill="url(#pc-fav-buttercup)" stroke="#6E530F" stroke-width="0.6" />
    <circle cx="28.5" cy="34" r="1.2" fill="#6E530F" />
    <circle cx="27.8" cy="33.3" r="0.6" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Layer 5: Paper Confetti Sparkles (Diamond & Triangular Cutouts) -->
  <g filter="url(#pc-fav-shadow-mid)">
    <!-- Buttercup Diamond Sparkle (Top Left) -->
    <path d="M14 11 L16 14 L14 17 L12 14 Z" fill="url(#pc-fav-buttercup)" />
    <!-- Mint Cutout Triangle (Bottom Right) -->
    <polygon points="50,46 54,49 48,51" fill="#A3D8C3" transform="rotate(15 51 48)" />
    <!-- Peach Diamond (Right Edge) -->
    <path d="M54 26 L56 28 L54 30 L52 28 Z" fill="#F7BA9E" />
  </g>
</svg>