<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- PaperCut 3D Layer Shadows: 2-Tier 48% Burnt Umber Standard -->
    <filter id="pc-fav-sh-stamp" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.6" flood-color="#2E1E14" flood-opacity="0.48"/>
      <feDropShadow dx="0" dy="3.2" stdDeviation="1.6" flood-color="#2E1E14" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="-0.5" stdDeviation="0.3" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
    <filter id="pc-fav-sh-scissors" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.5" flood-color="#2E1E14" flood-opacity="0.42"/>
      <feDropShadow dx="0.5" dy="2.0" stdDeviation="1.2" flood-color="#2E1E14" flood-opacity="0.25"/>
      <feDropShadow dx="-0.4" dy="-0.4" stdDeviation="0.2" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Centered 40x40 Motif at 1.35x Scale inside 64x64 Box -->
  <g transform="translate(5, 5) scale(1.35)">
    <!-- Layer 1: Postage Stamp Perforated Icon Background Plate (Mint Pastel #BBD5B8) -->
    <path d="M 6 4 Q 8 6 10 4 Q 12 6 14 4 Q 16 6 18 4 Q 20 6 22 4 Q 24 6 26 4 Q 28 6 30 4 Q 32 6 34 4 Q 36 6 38 4 Q 37 6 37 8 Q 39 10 37 12 Q 39 14 37 16 Q 39 18 37 20 Q 39 22 37 24 Q 39 26 37 28 Q 39 30 37 32 Q 39 34 37 36 Q 36 34 34 36 Q 32 34 30 36 Q 28 34 26 36 Q 24 34 22 36 Q 20 34 18 36 Q 16 34 14 36 Q 12 34 10 36 Q 8 34 6 36 Q 4 34 2 36 Q 3 34 3 32 Q 1 30 3 28 Q 1 26 3 24 Q 1 22 3 20 Q 1 18 3 16 Q 1 14 3 12 Q 1 10 3 8 Q 1 6 3 4 Z" fill="#BBD5B8" filter="url(#pc-fav-sh-stamp)"/>
    <!-- Layer 2: Inner Cream Paper Inlay Sheet -->
    <rect x="6.5" y="6.5" width="27" height="27" rx="3" fill="#FFFDF9"/>
    <!-- Layer 3: Dashed Perforation Ring -->
    <rect x="8.5" y="8.5" width="23" height="23" rx="2" fill="none" stroke="#D8CEBD" stroke-width="0.8" stroke-dasharray="2 2"/>
    <!-- Layer 4: 3D Paper-Cut Scissors Craft Motif -->
    <g transform="translate(10.5, 10.5) scale(0.29)" filter="url(#pc-fav-sh-scissors)">
      <circle cx="16" cy="18" r="9" fill="#F7BA9E"/>
      <circle cx="16" cy="18" r="5" fill="#FFFDF9"/>
      <circle cx="16" cy="46" r="9" fill="#F7BA9E"/>
      <circle cx="16" cy="46" r="5" fill="#FFFDF9"/>
      <path d="M 22 23 L 54 44 M 22 41 L 54 20" stroke="#FFFDF9" stroke-width="6" stroke-linecap="round"/>
      <path d="M 22 23 L 54 44 M 22 41 L 54 20" stroke="#A3D8C3" stroke-width="3" stroke-linecap="round"/>
      <circle cx="34" cy="32" r="3.2" fill="#FEE396"/>
    </g>
  </g>
</svg>
