<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 책 넘김</title>
<link rel="stylesheet" href="_sample.css">
<script src="../three@0.186.1/three.iife.min.js"></script>
<script src="../turngl@0.2.0/turngl.iife.js"></script>
<style>
  #book { width:100%; height:420px; display:block; touch-action:none; }
</style>
</head>
<body>
<main>
  <h1>곡면으로 휘는 3D 책 (turngl + three.js)</h1>
  <p class="lead">세 쪽을 캔버스로 그려 페이지 텍스처로 쓴다. 단추를 누르면 종이가 휘며 넘어간다.</p>
  <div class="stage">
    <canvas id="book"></canvas>
    <div class="row" style="margin-top:8px">
      <button class="act" id="prev">이전</button>
      <button class="act" id="next">다음</button>
      <span>펼침 <output id="spread">1</output> / 2</span>
    </div>
  </div>
  <p class="note"><code>&lt;turn-gl src="…pdf"&gt;</code> 요소는 PDF.js 워커를 외부 CDN에서 받도록 고정되어 있어 쓰지 않는다. <code>Book3D</code> 클래스만 쓰면 네트워크 호출이 없다.</p>
</main>
<script>
  // 페이지 캔버스 한 장 그리기 (책 비율 1.65 : 2.33)
  function page(title, body, hue) {
    const c = document.createElement('canvas'); c.width = 660; c.height = 932;
    const g = c.getContext('2d');
    g.fillStyle = '#fbf7ef'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = `hsl(${hue} 55% 45%)`; g.fillRect(0, 0, c.width, 120);
    g.fillStyle = '#fff'; g.font = 'bold 54px "Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    g.fillText(title, 48, 82);
    g.fillStyle = '#2b2a27'; g.font = '34px "Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    body.forEach((line, i) => g.fillText(line, 48, 220 + i * 56));
    g.strokeStyle = `hsl(${hue} 40% 60%)`; g.lineWidth = 6;
    g.beginPath(); g.arc(c.width / 2, 700, 110, 0, Math.PI * 2); g.stroke();
    return c;
  }
  const pages = [
    null,
    page('1쪽 · 씨앗', ['씨앗은 물과 온도가', '맞으면 싹이 튼다.'], 120),
    page('2쪽 · 떡잎', ['떡잎이 먼저 나오고', '본잎이 뒤따른다.'], 90),
    page('3쪽 · 꽃', ['꽃이 피면', '다시 씨앗을 맺는다.'], 330),
  ];
  const canvas = document.getElementById('book');
  const book = new turngl.Book3D(canvas, { theme: 'light' });
  // 생성자 안에서 첫 렌더가 돈다. three r18x 는 그때 'PCFSoftShadowMap has been removed' 경고를 한 번 내고 PCFShadowMap 으로 바꾼다(무해).
  const fit = () => book.resize(canvas.clientWidth, canvas.clientHeight);
  new ResizeObserver(fit).observe(canvas); fit();

  let spread = 0, busy = false;
  const out = document.getElementById('spread');
  const show = () => { book.showSpread(pages[spread * 2], pages[spread * 2 + 1] ?? null); out.textContent = spread + 1; };
  function flip(dir) {
    const total = Math.ceil(pages.length / 2);
    if (busy || (dir === 'fwd' && spread >= total - 1) || (dir === 'bwd' && spread <= 0)) return;
    busy = true;
    const front = dir === 'fwd' ? pages[spread * 2 + 1] : pages[spread * 2];
    const back  = dir === 'fwd' ? pages[spread * 2 + 2] : pages[spread * 2 - 1];
    book.prepFlip(dir, front ?? null, back ?? null);
    book.animate(0, 1, 780, (p) => book.curl(p, dir), () => {
      spread += dir === 'fwd' ? 1 : -1; book.endFlip(); show(); busy = false;
    });
  }
  document.getElementById('next').onclick = () => flip('fwd');
  document.getElementById('prev').onclick = () => flip('bwd');
  canvas.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    book.mouseLook((e.clientX - r.left) / r.width - 0.5, (e.clientY - r.top) / r.height - 0.5);
  });
  show();
</script>
</body>
</html>
