<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{게임 제목}}</title>
<!-- 외부 글꼴·CDN·아이콘 글꼴을 불러오지 않는다. 시스템 글꼴만 쓴다. -->
<style>
  :root {
    --bg: #f6f3ec; --surface: #ffffff; --ink: #1d2430; --muted: #4c5566;
    --line: #d9d3c6; --accent: #2f6fdf; --accent-ink: #ffffff;
    --good: #1f7a4d; --bad: #b3261e; --focus: #ffb200;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151820; --surface: #1f2430; --ink: #eef1f6; --muted: #b5bccb;
      --line: #394050; --accent: #7aa7ff; --accent-ink: #0d1424;
      --good: #6fd3a0; --bad: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 12px 16px 24px; }
  header.top { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  header.top h1 { font-size: 1.15rem; margin: 0; }
  .goal-chip { font-size: .85rem; color: var(--muted); margin: 2px 0 0; }
  button {
    font: inherit; min-height: 44px; min-width: 44px; padding: 10px 16px;
    border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink);
    cursor: pointer; touch-action: manipulation;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
  .stage { display: block; width: 100%; height: min(52vh, 440px); border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
  .hint { font-size: .85rem; color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  details { border-top: 1px solid var(--line); padding: 8px 0; }
  summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: keep-all; }
  /* 휴대폰에서는 캔버스를 줄여 조작 버튼이 첫 화면 안에 들어오게 한다 */
  @media (max-width: 520px) { .stage { height: min(38vh, 320px); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  /* {{게임별 스타일}} */
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>{{게임 제목}}</h1>
      <p class="goal-chip">{{성취기준 코드}} · {{학년}}</p>
    </div>
    <button type="button" data-action="mute" aria-pressed="false" aria-label="소리 끄기/켜기">소리</button>
  </header>

  <canvas id="stage" class="stage" aria-hidden="true"></canvas>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <!-- 1. 시작: 학습 목표를 먼저 보여 준다 -->
  <section id="intro" class="panel" aria-labelledby="intro-title">
    <h2 id="intro-title">오늘의 목표</h2>
    <p>{{학습 목표 한 문장}}</p>
    <p class="hint">{{조작 안내: 터치와 키보드 둘 다}}</p>
    <button type="button" class="primary" data-action="start" data-autofocus>시작하기</button>
  </section>

  <!-- 2. 놀이: 게임별 조작 버튼을 여기에 둔다 -->
  <section id="play" class="panel" hidden aria-label="놀이">
    {{놀이 조작 영역}}
  </section>

  <!-- 3. 정리: 무엇을 배웠는지 되짚는다 (빠뜨리면 안 된다) -->
  <section id="debrief" class="panel" hidden aria-labelledby="debrief-title">
    <h2 id="debrief-title" tabindex="-1" data-autofocus>정리하기</h2>
    <div id="debrief-body">{{정리 화면은 enterDebrief 에서 채운다}}</div>
    <button type="button" class="primary" data-action="restart">다시 하기</button>
  </section>
</div>
<script src="runtime.js"></script>
<script src="game.js"></script>
</body>
</html>
