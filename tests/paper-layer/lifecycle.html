<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>paper layer lifecycle</title>
<link rel="stylesheet" href="../../papercut-paper-layer.css">

<style>body{margin:0;padding:20px}.box{width:200px;height:60px}</style></head>
<body>
