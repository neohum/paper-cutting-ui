<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 120" width="512" height="120">
  <defs>
    <!-- PaperCut Multi-Tier Soft Umber 3D Shadows -->
    <filter id="pc-shadow-deep" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4A3828" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#4A3828" flood-opacity="0.16"/>
    </filter>
    <filter id="pc-shadow-mid" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#4A3828" flood-opacity="0.14"/>
    </filter>
    <filter id="pc-shadow-lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0.8" dy="3" stdDeviation="2.5" flood-color="#3A2518" flood-opacity="0.22"/>
    </filter>
    <filter id="pc-shadow-text" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#4A3828" flood-opacity="0.15"/>
    </filter>
    <filter id="pc-shadow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#3A2818" flood-opacity="0.18"/>
    </filter>

    <!-- Linear Gradients for Soft Paper Cardstock -->
    <linearGradient id="pc-grad-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF6ED"/>
    </linearGradient>
    <linearGradient id="pc-grad-mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B6E5D2"/>
      <stop offset="100%" stop-color="#8DCDB3"/>
    </linearGradient>
    <linearGradient id="pc-grad-peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAC8B0"/>
      <stop offset="100%" stop-color="#F2A584"/>
    </linearGradient>
    <linearGradient id="pc-grad-lavender" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2D8F5"/>
      <stop offset="100%" stop-color="#C5B4E4"/>
    </linearGradient>
    <linearGradient id="pc-grad-buttercup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#FCD56B"/>
    </linearGradient>
    <linearGradient id="pc-grad-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#ECE5D8"/>
    </linearGradient>
    <linearGradient id="pc-grad-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#483F37"/>
      <stop offset="100%" stop-color="#332B24"/>
    </linearGradient>
    <linearGradient id="pc-grad-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A9DEC9"/>
      <stop offset="100%" stop-color="#76C4A5"/>
    </linearGradient>

    <!-- Clip Path for Base Cardstock Rounded Squircle -->
    <clipPath id="pc-emblem-clip">
      <rect x="12" y="10" width="100" height="100" rx="26" />
    </clipPath>
  </defs>

  <!-- ============================================================== -->
  <!-- 1. LEFT EMBLEM: 3D Layered Paper Kirigami Art Shadowbox       -->
  <!-- ============================================================== -->
  <g id="pc-logo-emblem">
    <!-- Base Layer: 300g Matte Cream Cardstock Base with 3D Shadow -->
    <rect x="12" y="10" width="100" height="100" rx="26" fill="url(#pc-grad-cream)" filter="url(#pc-shadow-deep)" />
    <rect x="12" y="10" width="100" height="100" rx="26" fill="none" stroke="#FAF1E3" stroke-width="1.2" />

    <!-- Nested Kirigami Pastel Paper Layers (Clipped) -->
    <g clip-path="url(#pc-emblem-clip)">
      <!-- Layer 1: Pastel Lavender Curvature Sheet -->
      <path d="M12 56 C30 46 60 58 84 46 C98 38 108 44 112 36 L112 110 L12 110 Z" 
            fill="url(#pc-grad-lavender)" opacity="0.9" />

      <!-- Layer 2: Pastel Mint Scallop Contour Sheet -->
      <path d="M12 72 C32 64 56 78 82 68 C96 62 106 68 112 62 L112 110 L12 110 Z" 
            fill="url(#pc-grad-mint)" filter="url(#pc-shadow-mid)" />

      <!-- Layer 3: Pastel Peach Arc Ribbon -->
      <path d="M12 90 C34 82 66 94 92 84 C104 80 110 84 112 80 L112 110 L12 110 Z" 
            fill="url(#pc-grad-peach)" filter="url(#pc-shadow-mid)" />

      <!-- Craft Mat Metric Guidelines (Delicate laser grid) -->
      <path d="M37 10 L37 110 M62 10 L62 110 M87 10 L87 110 M12 35 L112 35 M12 60 L112 60 M12 85 L112 85" 
            stroke="#EDE5D5" stroke-width="0.8" stroke-dasharray="2 3.5" opacity="0.6" />
    </g>

    <!-- Signature Origami Dog-Ear Corner Fold (Top-Right) -->
    <g filter="url(#pc-shadow-mid)">
      <!-- Exposed Kraft Layer under Fold -->
      <path d="M84 10 L112 10 L112 38 Z" fill="#E8D8C2" />
      <!-- Folded Flap in Buttercup Cardstock -->
      <path d="M84 10 L112 38 L84 38 Z" fill="url(#pc-grad-buttercup)" />
      <!-- Crease Shadow & Fold Highlight -->
      <line x1="84" y1="10" x2="84" y2="38" stroke="#F5C856" stroke-width="0.8" />
      <line x1="84" y1="38" x2="112" y2="38" stroke="#E5B540" stroke-width="0.8" />
    </g>

    <!-- Dashed Kirigami Cutting Trajectory Arc -->
    <path d="M96 38 C90 44 76 52 60 63" 
          fill="none" stroke="#7D7368" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 2.5" opacity="0.75" />

    <!-- 3D Kirigami Craft Scissors (Hero Motif) -->
    <g filter="url(#pc-shadow-lift)">
      <!-- Lower Blade (Back Layer - Slicing Horizontally) -->
      <path d="M58 64 L96 61 C98.5 60.8 100 62.8 99.2 64.8 L94 72 C93 73.5 91.2 74 89.5 73 L55 69 Z" 
            fill="url(#pc-grad-blade)" stroke="#D4C9B8" stroke-width="0.7" stroke-linejoin="round" />

      <!-- Upper Handle Loop (Peach Pastel Cardstock) -->
      <path d="M57 60 L44 48 C37 42 27 45 23 52 C19 60 24 68 32 70 C37 71 43 68 47 64 L57 60 Z" 
            fill="url(#pc-grad-peach)" stroke="#E59A76" stroke-width="0.8" />
      <!-- Upper Handle Cutout -->
      <ellipse cx="32" cy="56" rx="6.5" ry="5.8" transform="rotate(-25 32 56)" 
               fill="#FFFDF9" stroke="#E59A76" stroke-width="0.7" />

      <!-- Upper Blade (Front Layer - Cutting Downwards) -->
      <path d="M57 60 L92 35 C94.5 33.2 97.5 35.5 96.2 38 L88 51 C87 52.8 85 53.5 83 53.5 L57 65 Z" 
            fill="url(#pc-grad-blade)" stroke="#D4C9B8" stroke-width="0.7" stroke-linejoin="round" />

      <!-- Lower Handle Loop (Mint Pastel Cardstock) -->
      <path d="M55 67 L45 79 C40 85 30 87 23 81 C16 75 17 65 24 59 C29 55 36 56 41 60 L55 67 Z" 
            fill="url(#pc-grad-mint)" stroke="#74BA9E" stroke-width="0.8" />
      <!-- Lower Handle Cutout -->
      <ellipse cx="31" cy="73" rx="6.8" ry="5.8" transform="rotate(25 31 73)" 
               fill="#FFFDF9" stroke="#74BA9E" stroke-width="0.7" />

      <!-- Center Brass Rivet / Craft Fastener -->
      <circle cx="58" cy="63.5" r="4.8" fill="url(#pc-grad-buttercup)" stroke="#70530C" stroke-width="0.8" />
      <circle cx="58" cy="63.5" r="2" fill="#70530C" />
      <circle cx="56.8" cy="62.2" r="1" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Floating Paper Cut Confetti / Diamonds -->
    <g filter="url(#pc-shadow-mid)">
      <polygon points="26,20 29,25 26,30 23,25" fill="url(#pc-grad-buttercup)" />
      <polygon points="101,84 107,88 98,92" fill="#A3D8C3" transform="rotate(18 102 88)" />
      <polygon points="102,48 105,51 102,54 99,51" fill="#F7BA9E" />
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 2. RIGHT TYPOGRAPHY: 'PaperCut' Pure Vector Paths              -->
  <!-- ============================================================== -->
  <g id="pc-logo-wordmark" fill="url(#pc-grad-ink)" filter="url(#pc-shadow-text)">
    <!-- Letter P -->
    <path fill-rule="evenodd" d="
      M 136, 64 L 136, 24 L 154, 24 
      C 163, 24, 169, 30, 169, 38 
      C 169, 46, 163, 52, 154, 52 
      L 144.5, 52 L 144.5, 64 Z 
      M 144.5, 31.5 L 144.5, 44.5 L 153.5, 44.5 
      C 157.5, 44.5, 160.5, 41.8, 160.5, 38 
      C 160.5, 34.2, 157.5, 31.5, 153.5, 31.5 Z
    " />

    <!-- Letter a -->
    <path fill-rule="evenodd" d="
      M 200, 43.5 L 193, 43.5 
      C 190.5, 39.5, 185.5, 38, 181, 38 
      C 171.5, 38, 165, 44.5, 165, 51.5 
      C 165, 58.5, 171.5, 65, 181, 65 
      C 185.5, 65, 190.5, 63, 193, 59 
      L 193, 64 L 200, 64 Z 
      M 182, 44.5 
      C 186.5, 44.5, 190, 47, 191.5, 50 
      C 192.5, 52, 192.5, 54, 191.5, 56 
      C 190, 59, 186.5, 61, 182, 61 
      C 176.5, 61, 172.5, 57, 172.5, 51.5 
      C 172.5, 46, 176.5, 44.5, 182, 44.5 Z
    " />

    <!-- Letter p -->
    <path fill-rule="evenodd" d="
      M 207, 39 L 214, 39 L 214, 42 
      C 217, 39.5, 221.5, 38, 226.5, 38 
      C 235.5, 38, 241.5, 44.5, 241.5, 51.5 
      C 241.5, 58.5, 235.5, 65, 226.5, 65 
      C 221.5, 65, 217, 63.5, 214, 60.5 
      L 214, 75 L 207, 75 Z 
      M 225, 44.5 
      C 229.5, 44.5, 233.5, 47.5, 233.5, 51.5 
      C 233.5, 55.5, 229.5, 58.5, 225, 58.5 
      C 220.5, 58.5, 217, 55.5, 215, 52.5 
      C 214.2, 51, 214.2, 49, 215, 47.5 
      C 217, 45.5, 220.5, 44.5, 225, 44.5 Z
    " />

    <!-- Letter e -->
    <path fill-rule="evenodd" d="
      M 273, 53 L 253, 53 
      C 253.5, 57.5, 257, 59.5, 261, 59.5 
      C 265, 59.5, 268, 57.5, 270, 55 
      L 275.5, 58 
      C 272.5, 62.5, 267.5, 65, 261, 65 
      C 251, 65, 245, 58.5, 245, 51.5 
      C 245, 44.5, 251, 38, 261, 38 
      C 269.5, 38, 275.5, 44, 275.5, 51.5 
      C 275.5, 52.2, 275, 53, 273, 53 Z 
      M 261, 43.5 
      C 256.5, 43.5, 253.5, 46, 252.8, 49 
      L 268.2, 49 
      C 267.5, 46, 265, 43.5, 261, 43.5 Z
    " />

    <!-- Letter r -->
    <path d="
      M 281, 39 L 288, 39 L 288, 45 
      C 290.5, 40.5, 295, 38, 300, 38 
      L 300, 45.5 
      C 295.5, 45.5, 291.5, 48, 288, 51 
      L 288, 64 L 281, 64 Z
    " />

    <!-- Letter C (Uppercase with Crafted Paper Arc) -->
    <path d="
      M 338, 33.5 L 332, 38 
      C 328.5, 33, 324, 30, 318, 30 
      C 309, 30, 303, 36.5, 303, 44 
      C 303, 51.5, 309, 58, 318, 58 
      C 324, 58, 328.5, 55, 332, 49.5 
      L 338, 54 
      C 333.5, 61, 327, 65, 318, 65 
      C 305, 65, 295, 55.5, 295, 44 
      C 295, 32.5, 305, 23, 318, 23 
      C 327, 23, 333.5, 27, 338, 33.5 Z
    " />

    <!-- Letter u -->
    <path d="
      M 346, 39 L 353, 39 L 353, 54 
      C 353, 57.5, 355.5, 59.5, 359.5, 59.5 
      C 363.5, 59.5, 366, 57.5, 366, 54 
      L 366, 39 L 373, 39 L 373, 64 L 366, 64 L 366, 58 
      C 363.5, 62, 359, 65, 354, 65 
      C 347, 65, 346, 59.5, 346, 53.5 Z
    " />

    <!-- Letter t (With Kirigami Angled Cut on Crossbar) -->
    <path d="
      M 383, 30 L 388, 25 L 388, 39 L 398, 39 L 398, 44.5 L 388, 44.5 
      L 388, 56.5 C 388, 59.5, 390, 60.5, 393, 60.5 C 395.5, 60.5, 397, 60, 398, 59 
      L 398, 64 C 395.5, 64.8, 392.5, 65.5, 389, 65.5 
      C 383.5, 65.5, 381, 62, 381, 56 L 381, 44.5 L 376, 44.5 L 376, 39 L 381, 39 L 381, 30 Z
    " />
  </g>

  <!-- ============================================================== -->
  <!-- 3. 'UI' 3D LAYERED CARDSTOCK PILL BADGE                       -->
  <!-- ============================================================== -->
  <g id="pc-logo-badge" filter="url(#pc-shadow-badge)">
    <!-- Bottom Paper Layer (Peach 3D Offset) -->
    <rect x="412" y="27" width="68" height="37" rx="14" fill="#F7BA9E" />
    
    <!-- Top Paper Layer (Mint Pastel Cardstock) -->
    <rect x="410" y="25" width="68" height="37" rx="14" fill="url(#pc-grad-badge)" stroke="#FAF6ED" stroke-width="1.2" />
    
    <!-- Delicate Perforated / Cut Stitched Border -->
    <rect x="413.5" y="28.5" width="61" height="30" rx="10.5" 
          fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3 2" opacity="0.75" />

    <!-- Pure White Cardstock Letters 'UI' -->
    <g fill="#FFFFFF" filter="url(#pc-shadow-text)">
      <!-- Letter U -->
      <path d="
        M 421, 33 L 427, 33 L 427, 44.5 
        C 427, 48, 429.5, 50, 433.5, 50 
        C 437.5, 50, 440, 48, 440, 44.5 
        L 440, 33 L 446, 33 L 446, 45 
        C 446, 51, 440.5, 54.5, 433.5, 54.5 
        C 426.5, 54.5, 421, 51, 421, 45 Z
      " />
      
      <!-- Letter I -->
      <path d="
        M 452, 33 L 458, 33 L 458, 54 L 452, 54 Z
      " />
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 4. SUBTITLE & CRAFT DIVIDER: 'Layered Craft Design System'     -->
  <!-- ============================================================== -->
  <g id="pc-logo-subtitle">
    <!-- Palette Swatch Studs (Mint, Peach, Lavender, Buttercup) -->
    <g transform="translate(136, 88)">
      <rect x="0" y="-4" width="7" height="7" rx="2" fill="#A3D8C3" transform="rotate(45 3.5 -0.5)" filter="url(#pc-shadow-mid)" />
      <rect x="14" y="-4" width="7" height="7" rx="2" fill="#F7BA9E" transform="rotate(45 17.5 -0.5)" filter="url(#pc-shadow-mid)" />
      <rect x="28" y="-4" width="7" height="7" rx="2" fill="#D7CBEB" transform="rotate(45 31.5 -0.5)" filter="url(#pc-shadow-mid)" />
      <rect x="42" y="-4" width="7" height="7" rx="2" fill="#FFE082" transform="rotate(45 45.5 -0.5)" filter="url(#pc-shadow-mid)" />
    </g>

    <!-- Subtitle Text -->
    <text x="194" y="91" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Nanum Square Round', sans-serif" 
          font-size="11.5" font-weight="800" letter-spacing="3.2" fill="#7D7368">
      LAYERED CRAFT DESIGN SYSTEM
    </text>

    <!-- Subtle End Divider Dash Line -->
    <line x1="472" y1="88" x2="494" y2="88" stroke="#D8CEBE" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3" />
  </g>
</svg>